[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-rag-rbac"
version = "0.1.0"
description = "RAG interno local con control de acceso por rol (RBAC), citas, abstención y auditoría"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Angel Salazar Lima" }]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
policy-rag-rbac = "policy_rag_rbac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
